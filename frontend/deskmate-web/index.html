<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Deskmate</title>
    <script>
      const media = matchMedia("(prefers-color-scheme: dark)");
      const stored = (() => {
        try {
          return localStorage.getItem("deskmate-theme");
        } catch {
          return null;
        }
      })();
      const applyTheme = () =>
        document.documentElement.classList.toggle(
          "dark",
          stored === "dark" || (stored !== "light" && media.matches),
        );
      applyTheme();
      if (stored !== "light" && stored !== "dark") media.addEventListener("change", applyTheme);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
